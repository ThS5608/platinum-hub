<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Progress — versão 0.1</title>
<style>
:root{--bg:#080b09;--panel:#101612;--panel2:#151e18;--line:#243329;--text:#edf5ef;--muted:#91a197;--green:#39d98a;--green2:#1e9d60;--gold:#e8c66a;--red:#f07878;--shadow:0 18px 50px #0008}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#163725 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:25px 17px;background:#090e0b;position:sticky;top:0;height:100vh}.brand{font-size:19px;font-weight:900;letter-spacing:1.8px;padding:5px 12px 28px}.brand b{color:var(--green)}.version{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1px}.navlabel{color:#718078;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:12px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#a9b8ae;text-align:left;padding:12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#14231a;color:var(--green)}.nav .ico{width:20px;text-align:center;font-size:17px}.sidefoot{position:absolute;bottom:20px;left:22px;right:22px;color:var(--muted);font-size:11px}.main{min-width:0;padding:26px clamp(18px,4vw,55px) 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:30px}.crumb{color:var(--muted);font-size:13px}.topright{display:flex;gap:10px;align-items:center}.avatar{width:36px;height:36px;border-radius:50%;background:#1c4931;display:grid;place-items:center;color:var(--green);font-weight:800}.h1{font-size:clamp(27px,4vw,38px);line-height:1.1;margin:0 0 8px;letter-spacing:-1px}.sub{color:var(--muted);margin:0 0 25px}.green{color:var(--green)}.panel{background:linear-gradient(145deg,#121a15,#0e1410);border:1px solid var(--line);border-radius:16px;padding:19px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:22px 0}.stat small{color:var(--muted);display:block}.stat strong{font-size:26px;display:block;margin-top:7px}.stat em{font-style:normal;color:var(--green);font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:27px 0 14px}.sectionhead h2{font-size:17px;margin:0}.textbtn{border:0;background:none;color:var(--green);font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.game{background:#111813;border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;transition:.18s}.game:hover{transform:translateY(-3px);border-color:#438b62}.cover{height:150px;position:relative;overflow:hidden;background:#19251e}.cover img{width:100%;height:100%;object-fit:cover;display:block}.cover:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0009)}.cover .tag{position:absolute;z-index:1;top:9px;left:9px;background:#07100bdc;border:1px solid #ffffff24;border-radius:6px;padding:4px 7px;font-size:10px}.gbody{padding:12px}.gtitle{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--muted);margin-top:3px}.progress{height:5px;background:#27342c;border-radius:9px;margin:11px 0 6px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:9px}.gfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.field{background:#0d130f;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px;min-width:0;outline:none}.field:focus{border-color:var(--green)}.search{flex:1;min-width:190px}.btn{border:1px solid var(--line);background:#17231b;padding:10px 14px;border-radius:9px;font-weight:700;font-size:12px}.btn.primary{background:var(--green);color:#06120a;border-color:var(--green)}.btn:hover{filter:brightness(1.12)}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 13px;border-radius:20px;font-size:12px}.tabs button.active{background:#183524;color:var(--green);border-color:#326c49}.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.row{display:flex;gap:13px;align-items:center}.row img{width:62px;height:76px;object-fit:cover;border-radius:8px}.rowgrow{flex:1;min-width:0}.muted{color:var(--muted)}.badge{display:inline-block;border-radius:20px;padding:4px 8px;background:#1b2c21;color:var(--green);font-size:10px;font-weight:800}.badge.gold{background:#352e19;color:var(--gold)}.detailhero{display:grid;grid-template-columns:220px 1fr;gap:25px;align-items:start}.detailhero>img{width:100%;border-radius:13px;box-shadow:var(--shadow)}.detailtitle{font-size:30px;margin:0 0 5px}.infochips{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.infochips span{background:#17221b;border:1px solid var(--line);padding:6px 9px;border-radius:7px;font-size:11px;color:#c4d1c8}.ach{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.achicon{width:40px;height:40px;border-radius:10px;background:#1b2c21;display:grid;place-items:center;font-size:19px}.ach.locked{opacity:.55}.ach .right{margin-left:auto;text-align:right;font-size:11px;color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.barline{height:8px;background:#27342c;border-radius:10px;overflow:hidden}.barline span{display:block;height:100%;background:var(--green)}.modalback{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modalback.show{display:flex}.modal{width:min(480px,100%);background:#101812;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 15px}.formgrid{display:grid;gap:11px}.formgrid label{font-size:12px;color:var(--muted);display:grid;gap:5px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1b3927;border:1px solid #347b50;padding:11px 17px;border-radius:10px;display:none;z-index:9}.toast.show{display:block}.mobilebar{display:none}.footerhint{font-size:11px;color:var(--muted);margin-top:28px}.rankbox{display:flex;align-items:center;gap:15px}.rankicon{font-size:35px}.rankname{font-size:21px;font-weight:900;color:var(--green)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{display:block}.side{display:none}.main{padding:18px 15px 85px}.top{margin-bottom:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:125px}.stats{gap:9px}.stat strong{font-size:22px}.detailhero{grid-template-columns:105px 1fr;gap:14px}.detailtitle{font-size:21px}.two{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;z-index:4;bottom:0;left:0;right:0;background:#0b110d;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:none;color:var(--muted);font-size:10px;display:grid;gap:2px;justify-items:center}.mobilebar button.active{color:var(--green)}.mobilebar b{font-size:18px}.row img{width:53px;height:66px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand">GAME<span class="green">PROGRESS</span><div class="version">PROTÓTIPO • V0.1</div></div>
 <div class="navlabel">MENU PRINCIPAL</div>
 <nav class="nav" id="sidenav">
 <button class="active" data-page="home"><span class="ico">⌂</span>Visão geral</button>
 <button data-page="library"><span class="ico">▦</span>Minha biblioteca</button>
 <button data-page="search"><span class="ico">⌕</span>Explorar jogos</button>
 <button data-page="stats"><span class="ico">◷</span>Estatísticas</button>
 <button data-page="profile"><span class="ico">◎</span>Meu perfil</button>
 </nav>
 <div class="sidefoot">Versão 0.1 · Dados salvos neste dispositivo<br>Integração Xbox: ainda não conectada</div>
</aside>
<main class="main">
 <header class="top"><div class="crumb">PLATAFORMA DE CONQUISTAS <span class="green">/</span> <span id="crumb">Visão geral</span></div><div class="topright"><span class="muted" style="font-size:12px">Jogador</span><div class="avatar" id="avatar">G</div></div></header>
 <div id="view"></div>
</main>
</div>
<nav class="mobilebar" id="mobilebar">
 <button class="active" data-page="home"><b>⌂</b>Início</button><button data-page="library"><b>▦</b>Biblioteca</button><button data-page="search"><b>⌕</b>Buscar</button><button data-page="stats"><b>◷</b>Stats</button><button data-page="profile"><b>◎</b>Perfil</button>
</nav>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const catalog=[
{id:1,name:"Forza Horizon 5",genre:"Corrida · Mundo aberto",platform:"Xbox · PC",difficulty:5,story:"20–25 h",full:"80–100 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2lbd.jpg",desc:"Explore um mundo aberto vibrante no México, participe de festivais e descubra centenas de carros.",ach:60,score:1000,played:42,progress:75},
{id:2,name:"Minecraft",genre:"Sandbox · Sobrevivência",platform:"Xbox · PC · PlayStation",difficulty:6,story:"30–50 h",full:"100+ h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1tnw.jpg",desc:"Explore, construa e sobreviva em mundos gerados proceduralmente, sozinho ou com amigos.",ach:125,score:2500,played:86,progress:62},
{id:3,name:"Elden Ring",genre:"RPG · Ação",platform:"Xbox · PlayStation · PC",difficulty:9,story:"55–65 h",full:"100–130 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg",desc:"Viaje pelas Terras Intermédias, enfrente desafios e descubra os segredos do Anel Prístino.",ach:42,score:1000,played:0,progress:0},
{id:4,name:"Red Dead Redemption 2",genre:"Ação · Aventura",platform:"Xbox · PlayStation · PC",difficulty:8,story:"50–60 h",full:"170–200 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1q1f.jpg",desc:"Viva a jornada de Arthur Morgan e da gangue Van der Linde no fim da era do Velho Oeste.",ach:51,score:1000,played:27,progress:38},
{id:5,name:"Stardew Valley",genre:"Simulação · RPG",platform:"Xbox · PC · PlayStation · Switch",difficulty:4,story:"50 h",full:"100–150 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1x7d.jpg",desc:"Construa a fazenda dos seus sonhos, faça amizades e descubra os segredos do vale.",ach:40,score:1000,played:0,progress:0},
{id:6,name:"Hollow Knight",genre:"Metroidvania · Ação",platform:"Xbox · PC · PlayStation · Switch",difficulty:8,story:"25–35 h",full:"60–80 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co1rgi.jpg",desc:"Desbrave um reino subterrâneo esquecido em uma aventura desenhada à mão.",ach:63,score:1000,played:0,progress:0},
{id:7,name:"Halo Infinite",genre:"FPS · Ficção científica",platform:"Xbox · PC",difficulty:6,story:"10–12 h",full:"30–45 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2ekt.jpg",desc:"Acompanhe Master Chief em uma nova aventura pelo universo Halo.",ach:69,score:1600,played:15,progress:22},
{id:8,name:"Cyberpunk 2077",genre:"RPG · Mundo aberto",platform:"Xbox · PC · PlayStation",difficulty:5,story:"25–30 h",full:"70–100 h",cover:"https://images.igdb.com/igdb/image/upload/t_cover_big/co2mjs.jpg",desc:"Torne-se V, um mercenário em busca de um implante que guarda o segredo da imortalidade.",ach:57,score:1000,played:0,progress:0}
];
let custom=[];let library=JSON.parse(localStorage.getItem("gp_lib")||'{"played":[1,2,4,7],"backlog":[3,5,6,8],"priority":[3]}');
let unlocked=JSON.parse(localStorage.getItem("gp_ach")||'[1,2,4,7]');
let page="home",filter="all",query="",selected=null;
const all=()=>[...catalog,...custom];
const game=id=>all().find(x=>x.id===id);
const save=()=>{localStorage.setItem("gp_lib",JSON.stringify(library));localStorage.setItem("gp_ach",JSON.stringify(unlocked))};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cover=(g)=>`<img src="${g.cover}" alt="Capa de ${esc(g.name)}" onerror="this.style.display='none';this.parentNode.style.background='linear-gradient(135deg,#1d4931,#101711)';this.parentNode.insertAdjacentHTML('beforeend','<div style=&quot;padding:22px;font-weight:900;font-size:19px;color:#dfffea&quot;>${esc(g.name)}</div>')">`;
function card(g,showProgress=false){let p=library.played.includes(g.id)?(g.progress||0):0;return `<article class="game" onclick="openGame(${g.id})"><div class="cover">${cover(g)}<span class="tag">${library.played.includes(g.id)?'JÁ JOGUEI':library.backlog.includes(g.id)?'BACKLOG':'CATÁLOGO'}</span></div><div class="gbody"><div class="gtitle">${esc(g.name)}</div><div class="meta">${esc(g.genre)}</div>${showProgress?`<div class="progress"><span style="width:${p}%"></span></div><div class="gfoot"><span>Progresso</span><b>${p}%</b></div>`:`<div class="gfoot" style="margin-top:10px"><span>Dificuldade ${g.difficulty}/10</span><span>${g.full}</span></div>`}</div></article>`}
function setPage(p){page=p;selected=null;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function heading(title,sub,action=""){return `<h1 class="h1">${title}</h1><p class="sub">${sub}</p>${action}`}
function render(){
document.getElementById("crumb").textContent=({home:"Visão geral",library:"Minha biblioteca",search:"Explorar jogos",stats:"Estatísticas",profile:"Meu perfil"}[page]||"Jogo");
let v=document.getElementById("view");
if(selected!==null){v.innerHTML=detail(game(selected));return}
if(page==="home"){
let played=library.played.map(game).filter(Boolean),recent=played.slice().reverse().slice(0,4),total=unlocked.length,plats=played.filter(g=>g.progress===100).length;
v.innerHTML=heading("Sua jornada gamer","Acompanhe seus jogos, conquistas e próximos objetivos.")+
`<div class="panel rankbox"><div class="rankicon">✦</div><div><div class="muted" style="font-size:11px">RANK ATUAL · DEMONSTRAÇÃO</div><div class="rankname">Explorador</div><div class="muted" style="font-size:12px">Continue jogando para avançar.</div></div><div style="margin-left:auto;text-align:right"><div class="muted" style="font-size:11px">SCORE TOTAL</div><strong class="green" style="font-size:24px">${(unlocked.length*125).toLocaleString("pt-BR")}</strong></div></div>
<div class="stats"><div class="panel stat"><small>Jogos iniciados</small><strong>${played.length}</strong><em>Na sua biblioteca</em></div><div class="panel stat"><small>Backlog</small><strong>${library.backlog.length}</strong><em>À sua espera</em></div><div class="panel stat"><small>Conquistas</small><strong>${total}</strong><em>Registradas</em></div><div class="panel stat"><small>Platinas</small><strong>${plats}</strong><em>100% concluídos</em></div></div>
<div class="sectionhead"><h2>Conquistas recentes</h2><button class="textbtn" onclick="setPage('stats')">Ver estatísticas →</button></div><div class="panel">${played.slice(0,3).map((g,i)=>`<div class="ach"><div class="achicon">${["🏆","⚔️","⭐"][i]}</div><div class="rowgrow"><b>${["Primeiro passo","Explorador","Em evolução"][i]}</b><div class="meta">${esc(g.name)}</div></div><span class="badge">+${i?50:100} Score</span></div>`).join("")||'<div class="muted">Suas conquistas aparecerão aqui.</div>'}</div>
<div class="sectionhead"><h2>Próximas conquistas</h2><span class="muted" style="font-size:11px">Objetivos sugeridos</span></div><div class="panel"><div class="ach"><div class="achicon">🔒</div><div class="rowgrow"><b>Concluir um jogo</b><div class="meta">Chegue a 100% em qualquer título.</div></div><span class="badge gold">Épica</span></div><div class="ach"><div class="achicon">🎯</div><div class="rowgrow"><b>Explorador de biblioteca</b><div class="meta">Adicione 5 jogos à sua biblioteca.</div></div><span class="badge">Rara</span></div></div>
<div class="sectionhead"><h2>Jogos recentes</h2><button class="textbtn" onclick="setPage('library')">Ver biblioteca →</button></div><div class="grid">${recent.map(g=>card(g,true)).join("")||'<div class="empty">Adicione jogos para começar.</div>'}</div>`;
}else if(page==="library"){
let ids=filter==="played"?library.played:filter==="backlog"?library.backlog:filter==="priority"?library.priority:[...new Set([...library.played,...library.backlog])];
let gs=ids.map(game).filter(Boolean).filter(g=>g.name.toLowerCase().includes(query.toLowerCase()));
v.innerHTML=heading("Minha biblioteca","Seus jogos iniciados e títulos que estão na sua lista.")+`<div class="toolbar"><input class="field search" placeholder="Buscar na biblioteca..." value="${esc(query)}" oninput="query=this.value;render()"><button class="btn primary" onclick="showAdd()">＋ Adicionar jogo</button></div><div class="tabs"><button class="${filter==='all'?'active':''}" onclick="setFilter('all')">Todos</button><button class="${filter==='played'?'active':''}" onclick="setFilter('played')">Já joguei</button><button class="${filter==='backlog'?'active':''}" onclick="setFilter('backlog')">Quero jogar</button><button class="${filter==='priority'?'active':''}" onclick="setFilter('priority')">★ Prioridade</button></div><div class="sectionhead"><h2>${gs.length} jogos</h2></div><div class="grid">${gs.map(g=>card(g,filter==='played'||library.played.includes(g.id))).join("")||'<div class="empty">Nenhum jogo encontrado nesta categoria.</div>'}</div>`;
}else if(page==="search"){
let gs=all().filter(g=>g.name.toLowerCase().includes(query.toLowerCase())||g.genre.toLowerCase().includes(query.toLowerCase()));
v.innerHTML=heading("Explorar jogos","Pesquise títulos em português ou inglês e descubra novas aventuras.")+`<div class="toolbar"><input class="field search" placeholder="Nome do jogo ou gênero..." value="${esc(query)}" oninput="query=this.value;render()"><select class="field" id="sort" onchange="sortSearch(this.value)"><option value="name">Nome A–Z</option><option value="easy">Menor dificuldade</option><option value="hard">Maior dificuldade</option></select></div><div class="sectionhead"><h2>Catálogo de demonstração</h2><span class="muted" style="font-size:11px">${gs.length} resultados</span></div><div class="grid" id="searchgrid">${gs.map(g=>card(g)).join("")||'<div class="empty">Nenhum resultado. Tente outro nome.</div>'}</div><p class="footerhint">Catálogo limitado de exemplo. A busca universal e a base completa de jogos serão planejadas para versões futuras.</p>`;
}else if(page==="stats"){
let count=library.played.length+library.backlog.length,avg=library.played.length?Math.round(library.played.map(id=>game(id)?.progress||0).reduce((a,b)=>a+b,0)/library.played.length):0;
v.innerHTML=heading("Estatísticas","Uma visão geral do seu progresso gamer.")+`<div class="stats"><div class="panel stat"><small>Score demonstrativo</small><strong>${(unlocked.length*125).toLocaleString("pt-BR")}</strong></div><div class="panel stat"><small>Jogos na biblioteca</small><strong>${count}</strong></div><div class="panel stat"><small>Progresso médio</small><strong>${avg}%</strong></div><div class="panel stat"><small>Conquistas registradas</small><strong>${unlocked.length}</strong></div></div><div class="two"><div class="panel"><h3>Biblioteca</h3><p class="muted">Jogos iniciados</p><h2>${library.played.length}</h2><div class="barline"><span style="width:${count?library.played.length/count*100:0}%"></span></div><p class="muted">Backlog: ${library.backlog.length}</p></div><div class="panel"><h3>Conclusão</h3><p class="muted">Média dos jogos iniciados</p><h2 class="green">${avg}%</h2><div class="barline"><span style="width:${avg}%"></span></div></div></div><p class="footerhint">As estatísticas desta versão usam dados de demonstração e alterações feitas neste dispositivo.</p>`;
}else if(page==="profile"){
v.innerHTML=heading("Meu perfil","Seu espaço pessoal na comunidade.")+`<div class="panel" style="text-align:center;padding:35px"><div class="avatar" style="width:75px;height:75px;margin:auto;font-size:27px">G</div><h2 style="margin-bottom:3px">Gamer</h2><span class="badge">Explorador</span><p class="muted">Perfil de demonstração · Nome editável em breve</p><div class="stats"><div class="panel stat"><small>Score</small><strong>${(unlocked.length*125).toLocaleString("pt-BR")}</strong></div><div class="panel stat"><small>Jogos</small><strong>${library.played.length}</strong></div><div class="panel stat"><small>Conquistas</small><strong>${unlocked.length}</strong></div><div class="panel stat"><small>Platinas</small><strong>${library.played.filter(id=>game(id)?.progress===100).length}</strong></div></div><button class="btn" onclick="toast('Edição de perfil ficará para uma próxima versão.')">Editar perfil</button></div><div class="sectionhead"><h2>Conexões</h2></div><div class="panel row"><div class="achicon">🎮</div><div class="rowgrow"><b>Conta Xbox</b><div class="meta">Integração ainda não configurada</div></div><button class="btn" onclick="toast('A conexão Xbox será implementada após validar o acesso às APIs.')">Em breve</button></div>`;
}
}
function setFilter(f){filter=f;render()}
function sortSearch(s){let arr=all().filter(g=>g.name.toLowerCase().includes(query.toLowerCase())||g.genre.toLowerCase().includes(query.toLowerCase()));if(s==="easy")arr.sort((a,b)=>a.difficulty-b.difficulty);if(s==="hard")arr.sort((a,b)=>b.difficulty-a.difficulty);if(s==="name")arr.sort((a,b)=>a.name.localeCompare(b.name));document.getElementById("searchgrid").innerHTML=arr.map(g=>card(g)).join("")||'<div class="empty">Nenhum resultado.</div>'}
function openGame(id){selected=id;render();window.scrollTo(0,0)}
function detail(g){
if(!g)return "";let inPlayed=library.played.includes(g.id),inBack=library.backlog.includes(g.id),done=g.progress===100;
let achievements=Array.from({length:Math.min(6,g.ach)},(_,i)=>({name:["Primeira vitória","Explorador","Colecionador","Desafio superado","Mestre das habilidades","Lenda do jogo"][i],desc:["Comece sua jornada.","Descubra uma nova região.","Encontre itens especiais.","Supere um desafio importante.","Domine uma habilidade.","Complete um objetivo avançado."][i],score:[50,75,100,150,200,300][i],rarity:["Comum","Incomum","Rara","Épica","Lendária","Mítica"][i],unlocked:i<Math.round((g.progress||0)/20)}));
return `<button class="textbtn" onclick="selected=null;render()">← Voltar</button><div class="detailhero" style="margin:18px 0 25px"><img src="${g.cover}" onerror="this.style.display='none'" alt="Capa ${esc(g.name)}"><div><div class="muted" style="font-size:11px">${esc(g.platform)}</div><h1 class="detailtitle">${esc(g.name)}</h1><div class="muted">${esc(g.genre)}</div><p>${esc(g.desc||"Descrição de demonstração do jogo.")}</p><div class="infochips"><span>Dificuldade ${g.difficulty}/10</span><span>Campanha ${g.story}</span><span>100% ${g.full}</span></div><div class="row" style="flex-wrap:wrap"><button class="btn primary" onclick="addTo('${inPlayed?'played':inBack?'backlog':'backlog'}',${g.id})">${inPlayed?'✓ Já está em Já joguei':inBack?'✓ No Backlog':'+ Adicionar ao Backlog'}</button>${inBack?`<button class="btn" onclick="addTo('played',${g.id})">Marcar como iniciado</button>`:""}<button class="btn" onclick="togglePriority(${g.id})">${library.priority.includes(g.id)?'★ Prioritário':'☆ Marcar prioridade'}</button></div></div></div>
<div class="stats"><div class="panel stat"><small>Tempo jogado</small><strong>${inPlayed?(g.played||0)+' h':'—'}</strong></div><div class="panel stat"><small>Conquistas</small><strong>${inPlayed?Math.round(g.ach*(g.progress||0)/100):0}/${g.ach}</strong></div><div class="panel stat"><small>Progresso</small><strong>${inPlayed?(g.progress||0)+'%':'0%'}</strong></div><div class="panel stat"><small>Score possível</small><strong>${g.score}</strong></div></div>
<div class="sectionhead"><h2>Conquistas</h2><span class="muted" style="font-size:11px">${g.ach} no total · amostra</span></div><div class="panel">${achievements.map((a,i)=>`<div class="ach ${a.unlocked?'':'locked'}"><div class="achicon">${a.unlocked?'🏆':'🔒'}</div><div class="rowgrow"><b>${a.name}</b><div class="meta">${a.desc}</div><div class="meta">${a.rarity}</div></div><div class="right">${a.score} pts<br>${a.unlocked?'Desbloqueada':'Bloqueada'}</div></div>`).join("")}<p class="footerhint">Lista ilustrativa. A lista real de conquistas depende dos dados disponibilizados pela plataforma.</p></div>`;
}
function addTo(where,id){library.played=library.played.filter(x=>x!==id);library.backlog=library.backlog.filter(x=>x!==id);library[where].push(id);let g=game(id);if(g&&where==="played"&&!g.progress)g.progress=1;save();toast(where==="played"?"Jogo movido para Já joguei.":"Jogo adicionado ao Backlog.");render()}
function togglePriority(id){library.priority=library.priority.includes(id)?library.priority.filter(x=>x!==id):[...library.priority,id];save();toast("Prioridades atualizadas.");render()}
function showAdd(){document.getElementById("modal").innerHTML=`<h2>Adicionar jogo</h2><div class="formgrid"><label>Nome do jogo<input class="field" id="newname" placeholder="Ex.: Sea of Thieves"></label><label>Gênero<input class="field" id="newgenre" placeholder="Aventura · Ação"></label><label>Plataforma<input class="field" id="newplatform" value="Xbox"></label><label>Categoria<select class="field" id="newwhere"><option value="backlog">Quero jogar (Backlog)</option><option value="played">Já joguei</option></select></label></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="createGame()">Adicionar</button></div>`;document.getElementById("modalback").classList.add("show")}
function createGame(){let name=document.getElementById("newname").value.trim();if(!name){toast("Digite o nome do jogo.");return}let id=Math.max(100,...all().map(g=>g.id))+1;custom.push({id,name,genre:document.getElementById("newgenre").value||"Gênero não informado",platform:document.getElementById("newplatform").value||"Não informado",difficulty:5,story:"A definir",full:"A definir",cover:"",desc:"Jogo adicionado manualmente à sua biblioteca.",ach:0,score:0,played:0,progress:0});library[document.getElementById("newwhere").value].push(id);save();closeModal();query="";filter="all";page="library";render();toast("Jogo adicionado!")}
function closeModal(){document.getElementById("modalback").classList.remove("show")}
function toast(msg){let t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{query="";filter="all";setPage(b.dataset.page)}));
document.getElementById("modalback").addEventListener("click",e=>{if(e.target.id==="modalback")closeModal()});
render();
</script>
</body></html>
